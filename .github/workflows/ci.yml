name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - name: Seeds pass every check
        run: python -m quote_distill.checks data/seeds
      - name: Frozen test set is unchanged
        run: python -m quote_distill.splits verify data/test
      - name: Generator keeps every document
        run: quote-distill-generate --n 1000 --seed 1 --split dev --out data/generated/ci
