name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - name: Seeds pass every check
        run: python -m quote_distill.checks data/seeds
      - name: Frozen test set is unchanged
        run: python -m quote_distill.splits verify data/test
      - name: Generator keeps every document
        run: quote-distill-generate --n 1000 --seed 1 --split dev --out data/generated/ci

  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: demo/package-lock.json
      - run: pip install -e .
      - name: Parity fixtures from the Python code
        run: |
          python -m quote_distill.student.data --out data/generated/student --n-train 1
          python -m quote_distill.student.fixtures --data data/generated/student/dev.jsonl --out demo/fixtures/dev.jsonl
      - run: npm ci
        working-directory: demo
      - run: npm run typecheck
        working-directory: demo
      - run: npm test
        working-directory: demo
